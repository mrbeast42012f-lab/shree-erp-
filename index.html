
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#183e70">
<title>SHREE ERP - Business Management</title>
<style>
:root{--navy:#183e70;--blue:#245a96;--light:#eaf1fa;--line:#9eafc5;--bg:#cbd5e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:12px Tahoma,Arial,sans-serif;color:#172b45}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus,input:focus,select:focus,textarea:focus{outline:2px solid #2469c8;outline-offset:1px}
.app{max-width:1600px;margin:auto;background:#e9eef5;min-height:100vh;border:1px solid #526b89}
.titlebar{background:linear-gradient(#426da3,#183e70);color:white;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:bold;font-size:18px;letter-spacing:.6px}.brand small{display:block;font-size:10px;font-weight:normal;margin-top:3px}
.title-actions{display:flex;gap:5px;flex-wrap:wrap}.btn{border:1px solid #8b9db3;background:linear-gradient(#fff,#dbe5f1);padding:6px 10px;color:#16395f;border-radius:2px;font-weight:bold}
.btn:hover{background:linear-gradient(#fff3cc,#f7d77c)}.btn.primary{background:linear-gradient(#467db8,#1d4c80);color:white;border-color:#173c67}.btn.danger{color:#a00000}.btn.small{padding:4px 7px}
.menubar{display:flex;flex-wrap:wrap;background:#dce6f2;border-bottom:1px solid #8098b6}.menubar button{border:0;border-right:1px solid #c1cedd;background:transparent;padding:9px 10px;color:#17385f}
.menubar button:hover,.menubar button.active{background:white;font-weight:bold}
.toolbar{display:flex;gap:5px;padding:7px;background:#edf2f8;border-bottom:1px solid #a9b8ca;flex-wrap:wrap}
.workspace{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;gap:7px;padding:7px;min-height:70vh}
.panel{border:1px solid #9eafc5;background:#f7f9fc;min-width:0}.panel-title{padding:8px;background:linear-gradient(#edf4fc,#cbd9e9);border-bottom:1px solid #9eafc5;font-weight:bold;color:#193f6d}
.side-link{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-bottom:1px solid #e0e6ed;background:#f8faff;color:#203d60}
.side-link:hover,.side-link.active{background:#d9e8f9;color:#123e76;font-weight:bold}.side-link .ico{display:inline-block;width:23px}
.center{min-width:0}.statusline{background:#e4ebf4;border-top:1px solid #9eafc5;padding:7px 10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.view-head{padding:10px;background:#e3ebf6;border:1px solid #9eafc5;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h2{font-size:16px;margin:0;color:#183e70}h3{font-size:13px;margin:0 0 10px;color:#183e70}
.banner{padding:18px;background:linear-gradient(115deg,#173b69,#3979b8);color:white;border:1px solid #12345c;margin-bottom:8px}
.banner h2{color:white;font-size:22px;margin-bottom:7px}.banner p{margin:0;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:8px}
.stat{border:1px solid #a6b7ca;background:white;padding:12px 9px}.stat .label{color:#586b82;margin-bottom:7px}.stat strong{font-size:19px;color:#1c4779}
.stat:nth-child(2){background:#eef7e9}.stat:nth-child(3){background:#fff5dc}.stat:nth-child(4){background:#e8f2ff}
.card{background:white;border:1px solid #a6b7ca;padding:12px;margin-bottom:8px}
.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.quickgrid button{min-height:43px}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-weight:bold;color:#304a68}
.field input,.field select,.field textarea,.searchbox{width:100%;padding:7px;border:1px solid #9eafc5;background:white;border-radius:0;min-width:0}
.field textarea{min-height:65px;resize:vertical}.form-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.table-wrap{overflow:auto;border:1px solid #a5b4c6;background:white;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{background:linear-gradient(#eaf1fa,#cbd9e9);color:#173b67;text-align:left;font-weight:bold}
th,td{border:1px solid #c4cfdd;padding:7px 8px}tbody tr:nth-child(even){background:#f0f5fb}tbody tr:hover{background:#fff1c9}
.empty{text-align:center;color:#66788c;padding:25px}.row-actions{display:flex;gap:4px}.row-actions .btn{padding:4px 7px}
.notice{padding:9px;border:1px solid #a4b7cb;background:#edf4fc;margin-bottom:8px;line-height:1.5}
.right-box{padding:8px;border-bottom:1px solid #e0e6ed}.right-box button{width:100%;margin-bottom:5px;text-align:left}
.muted{color:#6a7c91}.total-box{background:#edf3fa;border:1px solid #a5b4c6;padding:10px;text-align:right;font-weight:bold}
.hidden{display:none!important}
.modal-bg{position:fixed;inset:0;background:#15273c99;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}
.modal{background:#edf2f8;border:1px solid #58708e;width:min(560px,100%);box-shadow:0 8px 35px #0004;max-height:90vh;overflow:auto}
.modal-head{padding:10px;background:linear-gradient(#426da3,#183e70);color:white;font-weight:bold;display:flex;justify-content:space-between}
.modal-body{padding:15px}.modal-body .field{margin-bottom:10px}
.bill-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bill-item-box{border:1px solid #9eafc5;background:#f3f6fa;padding:10px;margin:10px 0}
.hotkey{display:inline-block;background:white;border:1px solid #a6b7ca;padding:3px 6px;margin:2px;font-weight:bold}
.bill-type{padding:8px;background:#eaf1fa;border:1px solid #9eafc5;margin-bottom:8px}
.warning{color:#a11;font-weight:bold}.success{color:#17602b;font-weight:bold}
@media(max-width:1050px){.workspace{grid-template-columns:160px minmax(0,1fr)}.right-panel{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bill-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.workspace{grid-template-columns:minmax(0,1fr);padding:5px}.left-panel{display:none}.brand{font-size:16px}.titlebar{align-items:flex-start}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.bill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.menubar button{padding:9px 8px}.toolbar .btn{flex:1}.banner{padding:14px}.banner h2{font-size:19px}}
@media(max-width:380px){.formgrid,.bill-grid{grid-template-columns:1fr}.title-actions .btn{padding:5px}.stat strong{font-size:16px}}
@media print{body{background:white}.titlebar,.menubar,.toolbar,.left-panel,.right-panel,.statusline,.view-head .btn,.form-actions,.no-print{display:none!important}.workspace{display:block;padding:0}.app{border:0}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
<header class="titlebar">
 <div class="brand">▦ SHREE ERP <small>BUSINESS MANAGEMENT SYSTEM</small></div>
 <div class="title-actions"><button class="btn" onclick="go('company')">Company</button><button class="btn" onclick="go('settings')">Settings</button></div>
</header>
<nav class="menubar" id="menubar">
 <button class="active" data-view="dashboard" onclick="go('dashboard')">Dashboard</button>
 <button data-view="items" onclick="go('items')">Masters</button>
 <button data-view="retail" onclick="go('retail')">Transactions</button>
 <button data-view="receipt" onclick="go('receipt')">Accounts</button>
 <button data-view="reports" onclick="go('reports')">Final Reports</button>
 <button data-view="gst" onclick="go('gst')">GST</button>
 <button data-view="stock" onclick="go('stock')">Stocks</button>
 <button data-view="daily" onclick="go('daily')">Daily Reports</button>
 <button data-view="ledger" onclick="go('ledger')">Ledger</button>
 <button data-view="links" onclick="go('links')">Links</button>
</nav>
<div class="toolbar">
 <button class="btn" onclick="go('retail')">＋ Retail Bill (F4)</button>
 <button class="btn" onclick="go('wholesale')">＋ Wholesale Bill</button>
 <button class="btn" onclick="go('purchase')">＋ Purchase</button>
 <button class="btn" onclick="go('items')">▤ Item Master</button>
 <button class="btn" onclick="go('parties')">♙ Party Master</button>
 <button class="btn" onclick="go('stock')">▤ Stock / Expiry</button>
 <button class="btn" onclick="go('ledger')">▥ Ledger</button>
 <button class="btn" onclick="backup()">⇩ Backup</button>
</div>
<div class="workspace">
 <aside class="panel left-panel">
  <div class="panel-title">☷ Navigation</div>
  <button class="side-link active" data-side="dashboard" onclick="go('dashboard')"><span class="ico">⌂</span>Dashboard</button>
  <div class="panel-title">MASTERS</div>
  <button class="side-link" data-side="items" onclick="go('items')">▤ Item Master</button>
  <button class="side-link" data-side="parties" onclick="go('parties')">♙ Party Master</button>
  <button class="side-link" data-side="company" onclick="go('company')">▣ Company</button>
  <div class="panel-title">TRANSACTIONS</div>
  <button class="side-link" data-side="retail" onclick="go('retail')">₹ Retail Sales</button>
  <button class="side-link" data-side="wholesale" onclick="go('wholesale')">▦ Wholesale Sales</button>
  <button class="side-link" data-side="purchase" onclick="go('purchase')">＋ Purchase</button>
  <button class="side-link" data-side="receipt" onclick="go('receipt')">↓ Receipt</button>
  <button class="side-link" data-side="payment" onclick="go('payment')">↑ Payment</button>
  <div class="panel-title">REPORT CENTRE</div>
  <button class="side-link" data-side="stock" onclick="go('stock')">▤ Stock Summary</button>
  <button class="side-link" data-side="expiry" onclick="go('expiry')">⌛ Batch / Expiry</button>
  <button class="side-link" data-side="ledger" onclick="go('ledger')">▥ Party Ledger</button>
  <button class="side-link" data-side="reports" onclick="go('reports')">▥ Final Reports</button>
  <button class="side-link" data-side="daily" onclick="go('daily')">▧ Daily Reports</button>
  <button class="side-link" data-side="gst" onclick="go('gst')">▦ GST Reports</button>
 </aside>
 <main class="center" id="main"></main>
 <aside class="panel right-panel">
  <div class="panel-title">⚡ Quick Access</div>
  <div class="right-box"><h3>Transactions</h3>
   <button class="btn" onclick="go('retail')">＋ New Retail Sale (F4)</button>
   <button class="btn" onclick="go('wholesale')">＋ Wholesale Sale</button>
   <button class="btn" onclick="go('purchase')">＋ New Purchase</button>
   <button class="btn" onclick="go('receipt')">↓ Receive Payment</button>
   <button class="btn" onclick="go('payment')">↑ Make Payment</button>
  </div>
  <div class="right-box"><h3>Masters & Reports</h3>
   <button class="btn" onclick="go('items')">Item Master / Barcode</button>
   <button class="btn" onclick="go('parties')">Party Master</button>
   <button class="btn" onclick="go('ledger')">Customer / Supplier Ledger</button>
   <button class="btn" onclick="go('expiry')">Batch / Expiry Alerts</button>
  </div>
  <div class="right-box"><h3>Data Tools</h3>
   <button class="btn" onclick="backup()">Export Backup</button>
   <button class="btn" onclick="$('restoreFile').click()">Import Backup</button>
   <input type="file" id="restoreFile" accept=".json,application/json" hidden onchange="restoreBackup(event)">
   <p class="muted">Data is saved in this browser.</p>
  </div>
 </aside>
</div>
<div class="statusline"><span id="statusCompany">Company: My Business</span><span id="statusText">Ready</span><span id="statusDate"></span><span>F2 Party · F3 Rename · F4 Retail · Esc Home</span></div>
</div>
<div id="modalRoot"></div>
<script>
"use strict";
const KEY="shree_erp_purple_v2";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const cleanQty=v=>Math.max(0,num(v));
const blank=()=>({company:{name:"My Business",address:"",phone:"",gstin:""},items:[],parties:[],bills:[],receipts:[],payments:[],purchases:[],batches:[]});

/* Batch stock is authoritative once batches exist. Missing legacy stock becomes an opening adjustment. */
function normalizeDB(source){
 const b=blank();
 if(source&&typeof source==="object"&&!Array.isArray(source)){
  b.company={...b.company,...(source.company&&typeof source.company==="object"?source.company:{})};
  ["items","parties","bills","receipts","payments","purchases","batches"].forEach(k=>b[k]=Array.isArray(source[k])?source[k]:[]);
 }
 b.items=b.items.filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid()),qty:cleanQty(x.qty)}));
 b.parties=b.parties.filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid())}));
 ["bills","receipts","payments","purchases"].forEach(k=>b[k]=b[k].filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid())})));
 b.batches=b.batches.filter(x=>x&&typeof x==="object").map(x=>({...x,id:String(x.id||uid()),itemId:String(x.itemId||""),batch:String(x.batch||"NO BATCH"),expiry:String(x.expiry||""),qty:cleanQty(x.qty),rate:cleanQty(x.rate),mrp:cleanQty(x.mrp)}));
 if(!b.batches.length){
  b.items.forEach(i=>{if(i.qty>0)b.batches.push({id:uid(),itemId:i.id,batch:"OPENING",expiry:"",qty:i.qty,rate:cleanQty(i.purchaseRate),mrp:cleanQty(i.mrp||i.rate),opening:true})});
 }else{
  b.items.forEach(i=>{
   let sum=b.batches.filter(x=>x.itemId===i.id).reduce((s,x)=>s+cleanQty(x.qty),0);
   // Preserve legacy item quantity if it is greater than known batch stock.
   if(i.qty>sum+0.000001){
    b.batches.push({id:uid(),itemId:i.id,batch:"OPENING ADJUSTMENT",expiry:"",qty:i.qty-sum,rate:cleanQty(i.purchaseRate),mrp:cleanQty(i.mrp||i.rate),opening:true});
    sum=i.qty;
   }
   // If batch sum is higher, keep the actual batch ledger and update the item total.
   i.qty=sum;
  });
 }
 return b;
}
function load(){
 try{const raw=localStorage.getItem(KEY);return raw?normalizeDB(JSON.parse(raw)):blank()}
 catch(e){return blank()}
}
let db=load(),view="dashboard",editId=null,draftLines=[],ledgerParty="";
function reconcileItem(itemId){
 const item=db.items.find(i=>i.id===itemId);if(!item)return;
 item.qty=db.batches.filter(b=>b.itemId===itemId).reduce((s,b)=>s+cleanQty(b.qty),0);
}
function reconcileAll(){
 db.items.forEach(i=>reconcileItem(i.id));
}
function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
  $("statusText").textContent="Saved successfully";
 }catch(e){
  $("statusText").textContent="Save failed";
  alert("Browser storage-এ জায়গা নেই বা storage বন্ধ। আগে Backup ডাউনলোড করো। ডেটা পুরোপুরি save হয়েছে ধরে নিও না।");
 }
 updateStatus();
}
function updateStatus(){
 $("statusCompany").textContent="Company: "+(db.company.name||"My Business");
 $("statusDate").textContent=new Date().toLocaleDateString("en-IN");
}
function go(v){
 view=v;editId=null;draftLines=[];
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));
 document.querySelectorAll("[data-side]").forEach(b=>b.classList.toggle("active",b.dataset.side===v));
 render();window.scrollTo({top:0,behavior:"smooth"});
}
function head(title,sub=""){
 return `<div class="view-head"><div><h2>${esc(title)}</h2>${sub?`<div class="muted" style="margin-top:4px">${esc(sub)}</div>`:""}</div><div><button class="btn" onclick="go('dashboard')">⌂ Home</button></div></div>`;
}
function stat(label,value){return `<div class="stat"><div class="label">${esc(label)}</div><strong>${value}</strong></div>`}
function table(headers,rows,empty="No records found"){
 return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">${empty}</td></tr>`}</tbody></table></div>`;
}
function render(){
 updateStatus();const root=$("main");
 if(view==="dashboard")root.innerHTML=dashboard();
 else if(view==="items")root.innerHTML=itemsPage();
 else if(view==="parties")root.innerHTML=partiesPage();
 else if(view==="company")root.innerHTML=companyPage();
 else if(view==="settings")root.innerHTML=settingsPage();
 else if(["retail","wholesale","purchase"].includes(view))root.innerHTML=transactionPage(view);
 else if(["receipt","payment"].includes(view))root.innerHTML=accountPage(view);
 else if(view==="stock")root.innerHTML=stockPage();
 else if(view==="expiry")root.innerHTML=expiryPage();
 else if(view==="ledger")root.innerHTML=ledgerPage();
 else if(["reports","daily","gst","links"].includes(view))root.innerHTML=reportsPage(view);
 else root.innerHTML=dashboard();
}
function dashboard(){
 const sales=db.bills.reduce((s,b)=>s+num(b.total),0),purchases=db.purchases.reduce((s,b)=>s+num(b.total),0);
 const stock=db.items.reduce((s,i)=>s+num(i.qty),0);
 const todaySales=db.bills.filter(b=>b.date===today()).reduce((s,b)=>s+num(b.total),0);
 const expiring=db.batches.filter(b=>b.expiry&&num(b.qty)>0&&daysToExpiry(b.expiry)>=0&&daysToExpiry(b.expiry)<=60).length;
 const recent=[...db.bills.map(x=>({...x,kind:x.kind==="wholesale"?"Wholesale":"Retail"})),...db.purchases.map(x=>({...x,kind:"Purchase"}))].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,8);
 const rows=recent.map(x=>`<tr><td>${esc(x.date||"")}</td><td>${esc(x.kind)}</td><td>${esc(x.no||"")}</td><td>${esc(x.party||"")}</td><td>${money(x.total)}</td></tr>`).join("");
 return `${head("Business Dashboard","SHREE ERP · Classic Edition")}
 <div class="banner"><h2>Welcome to SHREE ERP</h2><p>Business Management System<br>Masters · Retail Billing · Wholesale Billing · Batch Stock · Accounts · Reports</p></div>
 <div class="stats">${stat("Today's Sales",money(todaySales))}${stat("Total Sales",money(sales))}${stat("Total Purchase",money(purchases))}${stat("Items / Stock",db.items.length+" / "+stock)}</div>
 <div class="card"><h3>Quick Transactions</h3><div class="quickgrid">
 <button class="btn primary" onclick="go('retail')">＋ Retail Bill (F4)</button><button class="btn primary" onclick="go('wholesale')">＋ Wholesale Bill</button><button class="btn" onclick="go('purchase')">＋ Purchase Entry</button>
 <button class="btn" onclick="go('receipt')">↓ Receipt Entry</button><button class="btn" onclick="go('payment')">↑ Payment Entry</button><button class="btn" onclick="go('items')">▤ Item Master</button>
 <button class="btn" onclick="go('parties')">♙ Party Master (F2)</button><button class="btn" onclick="go('stock')">▤ Stock Summary</button><button class="btn" onclick="go('ledger')">▥ Party Ledger</button>
 <button class="btn" onclick="go('expiry')">⌛ Expiry Alerts (${expiring})</button><button class="btn" onclick="go('reports')">▥ Final Reports</button><button class="btn" onclick="backup()">⇩ Backup</button>
 </div></div>
 <div class="card"><h3>Recent Transactions</h3>${table(["Date","Type","Voucher No.","Party","Amount"],rows,"No transactions yet")}</div>
 <div class="notice">Keyboard: F2 Customer/Party · F3 Rename Customer · F4 Retail Bill · Esc Home · Enter Next Field</div>`;
}
function itemsPage(){
 const q=($("itemSearch")?.value||"").toLowerCase();
 const list=db.items.filter(x=>[x.name,x.code,x.barcode,x.company,x.type].some(v=>String(v||"").toLowerCase().includes(q)));
 const rows=list.map(x=>`<tr><td>${esc(x.code||"")}</td><td>${esc(x.barcode||"")}</td><td>${esc(x.name)}</td><td>${esc(x.type||"Others")}</td><td>${esc(x.company||"")}</td><td>${esc(x.unit||"PCS")}</td><td>${money(x.rate)}</td><td>${num(x.qty)}</td><td><div class="row-actions"><button class="btn" onclick="editItem('${esc(x.id)}')">Edit</button><button class="btn danger" onclick="deleteRecord('items','${esc(x.id)}')">Del</button></div></td></tr>`).join("");
 return `${head("Item Master","Product / Inventory / Barcode Master")}
 <div class="card"><h3 id="itemFormTitle">${editId?"Edit Item":"Add New Item"}</h3>
 <form onsubmit="saveItem(event)"><input type="hidden" id="itemId" value="${esc(editId||"")}">
 <div class="formgrid">
 <div class="field"><label>Item Code</label><input id="iCode" placeholder="ITM001"></div>
 <div class="field"><label>Barcode / Scan Code</label><input id="iBarcode" placeholder="Barcode number"></div>
 <div class="field"><label>Item Name *</label><input id="iName" required placeholder="Product name"></div>
 <div class="field"><label>Type</label><select id="iType"><option>Others</option><option>Medicine</option><option>Syrup</option><option>Tablet</option><option>Capsule</option><option>Food</option><option>General</option></select></div>
 <div class="field"><label>Company / Brand</label><input id="iCompany"></div><div class="field"><label>Unit / Pack</label><input id="iUnit" value="PCS"></div>
 <div class="field"><label>Sale Rate (₹)</label><input id="iRate" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Opening / Current Stock</label><input id="iQty" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Purchase Rate (₹)</label><input id="iPurchaseRate" type="number" min="0" step=".01" value="0"></div>
 <div class="field"><label>Default MRP (₹)</label><input id="iMrp" type="number" min="0" step=".01" value="0"></div>

function saveItem(e){
 e.preventDefault();
 const id=$("itemId").value||uid(),old=db.items.find(x=>x.id===id);
 const qty=cleanQty($("iQty").value);
 const x={...(old||{}),id,code:$("iCode").value.trim(),barcode:$("iBarcode").value.trim(),name:$("iName").value.trim(),type:$("iType").value,company:$("iCompany").value.trim(),unit:$("iUnit").value.trim()||"PCS",rate:cleanQty($("iRate").value),qty,purchaseRate:cleanQty($("iPurchaseRate").value),mrp:cleanQty($("iMrp").value)};
 if(!x.name)return alert("Item name লিখো।");
 if(x.barcode&&db.items.some(a=>a.id!==id&&String(a.barcode||"")===x.barcode))return alert("এই barcode অন্য পণ্যে ব্যবহার হয়েছে।");
 if(old){
  const oldQty=cleanQty(old.qty),diff=qty-oldQty;
  db.items=db.items.map(a=>a.id===id?x:a);
  if(Math.abs(diff)>.000001){
   if(diff>0){
    let opening=db.batches.find(b=>b.itemId===id&&b.opening);
    if(!opening){opening={id:uid(),itemId:id,batch:"OPENING ADJUSTMENT",expiry:"",qty:0,rate:x.purchaseRate,mrp:x.mrp,opening:true};db.batches.push(opening)}
    opening.qty=cleanQty(opening.qty)+diff;
   }else{
    let remaining=-diff;
    const batches=db.batches.filter(b=>b.itemId===id).sort((a,b)=>(a.opening?-1:0)-(b.opening?-1:0));
    for(const b of batches){const take=Math.min(remaining,cleanQty(b.qty));b.qty=cleanQty(b.qty)-take;remaining-=take;if(remaining<=.000001)break}
   }
  }
 }else{
  db.items.push(x);
  if(qty>0)db.batches.push({id:uid(),itemId:id,batch:"OPENING",expiry:"",qty,rate:x.purchaseRate,mrp:x.mrp,opening:true});
 }
 reconcileItem(id);save();editId=null;render();alert("Item saved.");
}

 $("itemFormTitle").textContent="Edit Item";$("iName").focus();window.scrollTo({top:0,behavior:"smooth"});
}

function searchBillItem(){
 const val=($("lineSearch")?.value||"").trim().toLowerCase();
 const item=db.items.find(i=>[i.name,i.code,i.barcode,i.id].some(v=>String(v||"").toLowerCase()===val));
 if(item){$("lineItem").value=item.id;fillLineRate()}
 else{$("lineItem").value="";if($("lineStock"))$("lineStock").value="—"}
}
function currentItem(){return db.items.find(i=>i.id===($("lineItem")?.value||""))}
function itemBatches(id){return db.batches.filter(b=>b.itemId===id&&cleanQty(b.qty)>0).sort((a,b)=>String(a.expiry||"9999-12").localeCompare(String(b.expiry||"9999-12")))}
function fillLineRate(){
 const i=currentItem();if(!i)return;
 $("lineSearch").value=i.barcode||i.code||i.name;$("linePack").value=i.unit||"PCS";
 $("lineRate").value=view==="purchase"?(i.purchaseRate||i.rate||0):(i.rate||0);
 if($("lineMrp"))$("lineMrp").value=i.mrp||i.rate||0;
 const batches=itemBatches(i.id);
 $("batchHints").innerHTML=batches.map(b=>`<option value="${esc(b.batch||"")}" label="Qty ${cleanQty(b.qty)} · Exp ${esc(b.expiry||"N/A")}"></option>`).join("");
 const typed=$("lineBatch").value.trim();
 const batch=typed?batches.find(b=>String(b.batch||"").toLowerCase()===typed.toLowerCase()):batches[0];
 if(batch){if(!typed)$("lineBatch").value=batch.batch||"";$("lineExpiry").value=batch.expiry||""}
 $("lineStock").value=view==="purchase"?cleanQty(i.qty):batches.reduce((s,b)=>s+cleanQty(b.qty),0);
 calcLinePreview();
}
function calcLinePreview(){
 if(!$("lineQty"))return;
 const qty=cleanQty($("lineQty").value),rate=cleanQty($("lineRate").value);
 const dist=Math.max(0,Math.min(100,num($("lineDist")?.value)));
 const discount=cleanQty($("lineDiscount").value),gst=Math.max(0,Math.min(100,num($("lineGst").value)));
 const base=Math.max(0,qty*rate*(1-dist/100)-discount),tax=base*gst/100;
 $("linePreview").value=money(base+tax);
}
function clearLineForm(){
 ["lineItem","lineSearch","linePack","lineBatch","lineExpiry","lineQty","lineFree","lineRate","lineMrp","lineDist","lineDiscount","lineGst"].forEach(id=>{
  const el=$(id);if(el)el.value=id==="lineQty"?"1":["lineFree","lineRate","lineMrp","lineDist","lineDiscount","lineGst"].includes(id)?"0":"";
 });
 if($("lineStock"))$("lineStock").value="—";
 if($("linePreview"))$("linePreview").value=money(0);
 $("lineSearch")?.focus();
}
function addBillLine(kind){
 const item=currentItem();if(!item)return alert("পণ্যের নাম বা barcode লিখে তালিকা থেকে সঠিক পণ্য নির্বাচন করো।");
 const qty=num($("lineQty").value),rate=num($("lineRate").value),free=num($("lineFree")?.value);
 const dist=num($("lineDist")?.value),discount=num($("lineDiscount").value),gst=num($("lineGst").value);
 if(qty<=0)return alert("Quantity অবশ্যই 0-এর বেশি হতে হবে।");
 if(rate<0||free<0||discount<0||dist<0||dist>100||gst<0||gst>100)return alert("Quantity, Rate, Discount বা GST পরীক্ষা করো।");
 const batches=itemBatches(item.id);let batch=null;
 if(kind!=="purchase"){
  const typed=$("lineBatch").value.trim();
  batch=typed?batches.find(b=>String(b.batch||"").toLowerCase()===typed.toLowerCase()):batches[0];
  if(!batch)return alert("এই পণ্যের কোনো available batch নেই। আগে Purchase Entry-তে stock যোগ করো অথবা সঠিক batch নির্বাচন করো।");
  const already=draftLines.filter(l=>l.itemId===item.id&&l.batchId===batch.id).reduce((s,l)=>s+l.qty+(num(l.free)),0);
  if(cleanQty(batch.qty)<already+qty+free)return alert("এই batch-এর stock পর্যাপ্ত নয়। Available: "+cleanQty(batch.qty));
  $("lineBatch").value=batch.batch||"";$("lineExpiry").value=batch.expiry||"";
 }
 const base=Math.max(0,qty*rate*(1-dist/100)-discount),tax=base*gst/100;
 draftLines.push({id:uid(),itemId:item.id,item:item.name,pack:$("linePack").value.trim()||item.unit||"PCS",batchId:batch?.id||"",batch:$("lineBatch").value.trim(),expiry:$("lineExpiry").value,qty,free:kind==="retail"?0:free,rate,dist,discount,gst,tax,mrp:num($("lineMrp")?.value)||item.mrp||item.rate||0,amount:base+tax});
 renderDraftLinesIntoPage();clearLineForm();updateBillTotal();
}
function renderDraftLines(){
 if(!draftLines.length)return `<div class="empty">এখনও কোনো পণ্য যোগ করা হয়নি। উপরের ফর্ম থেকে পণ্য যোগ করো।</div>`;
 const rows=draftLines.map((x,n)=>`<tr><td>${n+1}</td><td>${esc(x.item)}</td><td>${esc(x.pack||"")}</td><td>${esc(x.batch||"—")}</td><td>${esc(x.expiry||"—")}</td><td>${x.qty}</td><td>${x.free||0}</td><td>${money(x.rate)}</td><td>${x.dist||0}%</td><td>${x.gst||0}%</td><td>${money(x.amount)}</td><td><button class="btn danger small" type="button" onclick="removeBillLine('${x.id}')">Remove</button></td></tr>`).join("");
 return table(["#","Product","Pack","Batch","Expiry","Qty","Free","Rate","Dist %","GST","Amount","Action"],rows);
}
function renderDraftLinesIntoPage(){if($("draftLineTable"))$("draftLineTable").innerHTML=renderDraftLines()}
function removeBillLine(id){draftLines=draftLines.filter(x=>x.id!==id);renderDraftLinesIntoPage();updateBillTotal()}
function getLineTotals(){
 const subtotal=draftLines.reduce((s,x)=>s+Math.max(0,num(x.qty)*num(x.rate)*(1-num(x.dist)/100)-num(x.discount)),0);
 const gst=draftLines.reduce((s,x)=>s+num(x.tax),0);
 const billDiscount=cleanQty($("tBillDiscount")?.value),round=num($("tRound")?.value);
 return {subtotal,gst,billDiscount,round,total:Math.max(0,subtotal+gst-billDiscount+round)};
}
function updateBillTotal(){
 if(!$("tTotal"))return;const t=getLineTotals();
 $("tSubtotal").textContent=money(t.subtotal);$("tGstTotal").textContent=money(t.gst);
 $("tDiscountShow").textContent=money(t.billDiscount);$("tRoundShow").textContent=money(t.round);$("tTotal").textContent=money(t.total);
}

}
function normalizedBatchName(v){return String(v||"").trim()||"NO BATCH"}
function findOrCreateBatch(line){
 const name=normalizedBatchName(line.batch),expiry=String(line.expiry||"");
 let b=db.batches.find(x=>x.itemId===line.itemId&&normalizedBatchName(x.batch).toLowerCase()===name.toLowerCase()&&String(x.expiry||"")===expiry);
 if(!b){b={id:uid(),itemId:line.itemId,batch:name,expiry,qty:0,rate:cleanQty(line.rate),mrp:cleanQty(line.mrp)};db.batches.push(b)}
 return b;
}
function saveTransaction(e,kind){
 e.preventDefault();
 if(!draftLines.length)return alert("Bill save করার আগে অন্তত একটি পণ্য যোগ করো।");
 const purchase=kind==="purchase",key=purchase?"purchases":"bills",no=$("tNo").value.trim();

function daysToExpiry(expiry){
 if(!expiry)return Infinity;
 const parts=String(expiry).split("-").map(Number);if(parts.length<2||!parts[0]||!parts[1])return Infinity;
 const expiryDate=new Date(parts[0],parts[1],0,23,59,59),now=new Date();now.setHours(0,0,0,0);
 return Math.ceil((expiryDate-now)/(24*60*60*1000));
}

/* ---------- Safe Delete / Backup / Restore ---------- */
function recordLines(x){
 if(Array.isArray(x.lines))return x.lines;
 if(x.itemId)return [{itemId:x.itemId,batchId:"",batch:"",expiry:"",qty:num(x.qty),free:0,rate:num(x.rate)}];
 return [];
}
function resolveLineBatch(line){
 return db.batches.find(b=>line.batchId&&b.id===line.batchId)
  ||db.batches.find(b=>b.itemId===line.itemId&&normalizedBatchName(b.batch).toLowerCase()===normalizedBatchName(line.batch).toLowerCase()&&String(b.expiry||"")===String(line.expiry||""));
}
function deleteRecord(key,id){
 const x=db[key]?.find(r=>r.id===id);if(!x)return;
 if(!confirm("এই record delete করবে?"))return;
 if(key==="bills"||key==="purchases"){
  const purchase=key==="purchases",lines=recordLines(x);
  // Preflight the whole deletion. Never partly change stock before discovering a shortage.
  if(purchase){
   const needs={};
   lines.forEach(l=>{
    const b=resolveLineBatch(l),qty=num(l.qty)+num(l.free);
    if(b)needs[b.id]=(needs[b.id]||0)+qty;
    else if(qty>0)needs["MISSING:"+l.itemId]=(needs["MISSING:"+l.itemId]||0)+qty;
   });
   for(const [bid,qty] of Object.entries(needs)){
    if(bid.startsWith("MISSING:"))return alert("এই Purchase-এর batch পাওয়া যাচ্ছে না। নিরাপদে delete করা হয়নি। আগে Backup নিয়ে batch/stock যাচাই করো।");
    const b=db.batches.find(z=>z.id===bid);
    if(!b||cleanQty(b.qty)+.000001<qty)return alert("এই Purchase-এর কিছু stock ইতিমধ্যে বিক্রি/ব্যবহৃত হয়েছে বা batch stock কম। ভুল stock তৈরি এড়াতে Purchase delete করা হয়নি।");
   }
  }
  if(!lines.length&&x.itemId)return alert("পুরোনো voucher-এ stock-এর যথেষ্ট তথ্য নেই। নিরাপদে delete করা হয়নি।");
  if(purchase){
   lines.forEach(l=>{const b=resolveLineBatch(l);b.qty=cleanQty(b.qty-num(l.qty)-num(l.free))});
  }else{
   lines.forEach(l=>{
    const item=db.items.find(i=>i.id===l.itemId),qty=num(l.qty)+num(l.free);
    let b=resolveLineBatch(l);
    if(!b){b={id:uid(),itemId:l.itemId,batch:normalizedBatchName(l.batch||"RESTORED"),expiry:l.expiry||"",qty:0,rate:cleanQty(l.rate),mrp:cleanQty(l.mrp),opening:true};db.batches.push(b)}
    b.qty=cleanQty(b.qty)+qty;
    if(!item)db.items.push({id:l.itemId||uid(),name:l.item||"Restored item",qty:qty,rate:num(l.rate),purchaseRate:num(l.rate),unit:l.pack||"PCS"});
   });
  }
  reconcileAll();
 }
 if(key==="items")db.batches=db.batches.filter(b=>b.itemId!==id);
 db[key]=db[key].filter(r=>r.id!==id);save();render();
}
function backup(){
 try{
  const payload={format:"SHREE-ERP",version:2,exportedAt:new Date().toISOString(),data:db};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="SHREE-ERP-backup-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  $("statusText").textContent="Backup download requested";
 }catch(e){alert("Backup তৈরি করা যায়নি। Browser download permission পরীক্ষা করো।")}
}
function restoreBackup(e){
 const file=e.target.files?.[0];if(!file)return;
 if(file.size>25*1024*1024){alert("Backup file 25 MB-এর বেশি। Import করা হয়নি।");e.target.value="";return}
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const incoming=JSON.parse(reader.result);
   if(!incoming||typeof incoming!=="object"||Array.isArray(incoming))throw Error("Invalid JSON");
   const source=incoming.data&&typeof incoming.data==="object"?incoming.data:incoming;
   const arrKeys=["items","parties","bills","receipts","payments","purchases","batches"];
   for(const k of arrKeys)if(source[k]!==undefined&&!Array.isArray(source[k]))throw Error("Invalid "+k);
   if(!Array.isArray(source.items)||!Array.isArray(source.parties))throw Error("Missing master data");
   // Validate the file completely before replacing the current in-memory database.
   for(const k of ["items","parties","bills","receipts","payments","purchases","batches"]){
    if(Array.isArray(source[k]))for(const row of source[k])if(!row||typeof row!=="object"||Array.isArray(row))throw Error("Invalid row in "+k);
   }
   const next=normalizeDB(source);
   if(!confirm("Import করলে বর্তমান ERP data replace হবে। আগে বর্তমান data-র Backup ডাউনলোড করেছ?"))return;
   // Test storage before changing active db. Existing storage key remains unchanged.
   try{localStorage.setItem(KEY,JSON.stringify(next));}
   catch(storageError){alert("Browser storage-এ জায়গা নেই। Current data replace করা হয়নি।");return}
   db=next;draftLines=[];editId=null;ledgerParty="";go("dashboard");
   $("statusText").textContent="Backup imported successfully";
   alert("Backup imported. Stock ও batch totals যাচাই করা হয়েছে।");
  }catch(err){alert("Backup file invalid বা অসম্পূর্ণ। Current data replace করা হয়নি.")}
  finally{e.target.value=""}
 };
 reader.onerror=()=>{alert("Backup file পড়া যায়নি।");e.target.value=""};
 reader.readAsText(file);
}
function clearData(){
 if(!confirm("সত্যিই সব ERP data মুছতে চাও?"))return;
 if(!confirm("শেষবার নিশ্চিত করো। আগে backup নিয়েছ?"))return;

}

  body=`<tr><td colspan="8"><b>Party:</b> ${esc(x.party)} ${x.phone?" · Mobile: "+esc(x.phone):""}<br>${esc(x.address||"")}</td></tr>`;
  if(x.doctor)body+=`<tr><td colspan="8"><b>Doctor:</b> ${esc(x.doctor)} &nbsp; <b>Reg. No.:</b> ${esc(x.regNo||"")}</td></tr>`;
  body+=`<tr><th>Item</th><th>Pack</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr>`;
  body+=lines.map(l=>`<tr><td>${esc(l.item)}</td><td>${esc(l.pack||"")}</td><td>${esc(l.batch||"—")}</td><td>${esc(l.expiry||"—")}</td><td>${esc(l.qty)}${num(l.free)>0?" + "+esc(l.free)+" free":""}</td><td>${money(l.rate)}</td><td>${esc(l.gst||0)}%</td><td>${money(l.amount??(num(l.qty)*num(l.rate)))}</td></tr>`).join("");
  body+=`<tr><td colspan="7" class="right">Taxable Subtotal</td><td>${money(x.subtotal??x.total)}</td></tr><tr><td colspan="7" class="right">GST Total</td><td>${money(x.gstTotal||0)}</td></tr><tr><td colspan="7" class="right">Bill Discount</td><td>${money(x.discount)}</td></tr><tr><td colspan="7" class="right">Round Off</td><td>${money(x.roundOff||0)}</td></tr><tr><th colspan="7" class="right">Net Total</th><th>${money(x.total)}</th></tr>`;
 }
 const title=x.kind==="purchase"?"PURCHASE VOUCHER":x.kind==="wholesale"?"WHOLESALE TAX INVOICE":isAccount?"ACCOUNT VOUCHER":"RETAIL INVOICE";
 const w=window.open("","_blank","width=900,height=750");
 if(!w)return alert("Print window blocked. Browser pop-up allow করো।");
 w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(title)} ${esc(x.no)}</title>
 <style>*{box-sizing:border-box}body{font:12px Arial,sans-serif;padding:20px;color:#222;max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #183e70;padding-bottom:12px}h1{font-size:23px;margin:0 0 5px;color:#183e70}h2{font-size:17px;margin:18px 0 8px}.muted{color:#555;line-height:1.5}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border:1px solid #7c8794;padding:8px;text-align:left}th{background:#eaf1fa}.right{text-align:right}.signature{margin-top:50px;display:flex;justify-content:space-between}@page{size:A4;margin:12mm}@media print{body{padding:0}.no-print{display:none}}</style></head><body>
 <div class="top"><div><h1>${esc(company.name||"SHREE ERP")}</h1><div class="muted">${esc(company.address||"")}<br>${esc(company.phone||"")}${company.gstin?" · GSTIN: "+esc(company.gstin):""}</div></div><div style="text-align:right"><b>SHREE ERP</b><div class="muted">Business Management System</div></div></div>
 <h2>${title}</h2><div class="meta"><div><b>Voucher No.:</b> ${esc(x.no||"")}<br><b>Date:</b> ${esc(x.date||"")}</div><div><b>Document Type:</b> ${esc(x.kind||"Account")}<br><b>Printed:</b> ${esc(new Date().toLocaleDateString("en-IN"))}</div></div>
 <table>${body}</table><p>${esc(x.note||"")}</p><div class="signature"><span>Customer Signature __________________</span><span>Authorised Signature __________________</span></div>
 <p class="muted">Computer-generated document from SHREE ERP. Verify invoice details before accounting or tax filing.</p><button class="no-print" onclick="window.print()">Print</button><script>window.onload=()=>window.print()<\/script></body></html>`);
 w.document.close();
}

/* ---------- F2 Party Picker / Quick Add ---------- */
function openPartyPicker(){
 if(!["retail","wholesale","purchase"].includes(view)){go("parties");return}
 const allowed=view==="purchase"?["Supplier","Both"]:["Customer","Both"];
 $("modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><span>F2 · Select / Add Party</span><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body">
 <div class="field"><label>Search / Select Party</label><select id="pickerParty"><option value="">Cash / Walk-in</option>${db.parties.filter(p=>allowed.includes(p.type)).map(p=>`<option value="${esc(p.name)}">${esc(p.name)} · ${esc(p.phone||"")}</option>`).join("")}</select></div>
 <div class="form-actions"><button class="btn primary" onclick="chooseParty()">Select Party</button><button class="btn" onclick="showQuickParty()">＋ New Party</button></div>
 <p class="muted">Party নির্বাচন করলে invoice-এ নাম, address ও mobile বসবে।</p></div></div></div>`;
 $("pickerParty").focus();
}
function closeModal(){$("modalRoot").innerHTML=""}
function chooseParty(){const name=$("pickerParty").value;if($("tParty")){$("tParty").value=name;showPartyInfo()}closeModal()}
function showQuickParty(){
 $("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><span>New Customer / Party</span><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body">
 <div class="field"><label>Party Name *</label><input id="qName" required></div><div class="field"><label>Mobile</label><input id="qPhone" inputmode="tel"></div>
 <div class="field"><label>Address</label><input id="qAddress"></div><div class="field"><label>GSTIN</label><input id="qGstin"></div><div class="field"><label>DL No.</label><input id="qDl"></div>
 <div class="form-actions"><button class="btn primary" onclick="saveQuickParty()">Save & Select</button><button class="btn" onclick="openPartyPicker()">Back</button></div></div></div></div>`;
 $("qName").focus();
}
function saveQuickParty(){
 const name=$("qName").value.trim();if(!name)return alert("Party name লিখো।");
 let p=db.parties.find(p=>p.name.toLowerCase()===name.toLowerCase());
 if(!p){
  p={id:uid(),name,type:view==="purchase"?"Supplier":"Customer",phone:$("qPhone").value.trim(),address:$("qAddress").value.trim(),gstin:$("qGstin").value.trim(),dlNo:$("qDl").value.trim(),balance:0};
  db.parties.push(p);save();
 }
 if($("tParty")){
  const sel=$("tParty");if(![...sel.options].some(o=>o.value===p.name)){const op=document.createElement("option");op.value=p.name;op.textContent=p.name;sel.appendChild(op)}
  sel.value=p.name;showPartyInfo();
 }
 closeModal();
}
function renameCustomer(){
 let current=$("tParty")?.value||$("aParty")?.value||"";
 if(!current||current==="Cash Account"||current==="Cash / Walk-in")current=prompt("যে customer-এর নাম বদলাবে, বর্তমান নাম লিখো:");
 if(!current)return;const p=db.parties.find(x=>x.name===current);
 if(!p)return alert("এই নামে Party Master-এ customer পাওয়া যায়নি।");
 const next=prompt("নতুন customer name লিখো:",p.name);if(!next||!next.trim())return;
 const newName=next.trim();if(db.parties.some(x=>x.id!==p.id&&x.name.toLowerCase()===newName.toLowerCase()))return alert("এই নামের party আগে থেকেই আছে।");
 const oldName=p.name;p.name=newName;
 ["bills","purchases","receipts","payments"].forEach(k=>db[k].forEach(x=>{if(x.party===oldName)x.party=newName}));
 save();render();alert("Customer name updated.");
}

/* ---------- Keyboard Shortcuts ---------- */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  if($("modalRoot").innerHTML){closeModal();e.preventDefault();return}
  if(view!=="dashboard"){go("dashboard");e.preventDefault()}return;
 }
 if(e.key==="F2"){e.preventDefault();openPartyPicker();return}
 if(e.key==="F3"){e.preventDefault();renameCustomer();return}
 if(e.key==="F4"){e.preventDefault();go("retail");return}
 if(e.key==="F1"&&["retail","wholesale"].includes(view)){
  e.preventDefault();if($("tDoctor"))$("tDoctor").focus();else alert("Doctor field Retail Billing-এ পাওয়া যাবে।");return;
 }
 if(e.key==="Enter"&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){
  const target=e.target;
  if(target.closest(".modal-bg"))return;
  if(!target.matches("input,select,textarea")||target.matches("[type=submit],[type=button],[readonly]")||target.tagName==="TEXTAREA")return;
  if(target.id==="lineSearch"){
   const val=target.value.trim().toLowerCase(),i=db.items.find(i=>[i.name,i.code,i.barcode,i.id].some(v=>String(v||"").toLowerCase()===val));
   if(i){e.preventDefault();$("lineItem").value=i.id;fillLineRate();$("linePack").focus();return}
  }
  const form=target.closest("form");if(!form)return;
  const fields=[...form.querySelectorAll("input:not([type=hidden]):not([type=button]):not([type=submit]):not([readonly]),select,textarea")].filter(el=>!el.disabled&&el.offsetParent!==null);
  const idx=fields.indexOf(target);
  if(idx>=0){e.preventDefault();if(idx<fields.length-1)fields[idx+1].focus();else if(form.requestSubmit)form.requestSubmit();else form.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))}
 }
});
render();updateStatus();
</script>
